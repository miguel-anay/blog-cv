name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Typecheck + Tests + Build
    runs-on: ubuntu-24.04 # ponytail: Playwright 1.60 has no chromium for ubuntu 26.04; back to latest when supported
    env:
      TURSO_URL: ${{ secrets.TURSO_URL }}
      TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install -g pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm astro check

      - run: pnpm test:unit

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test

      - run: pnpm build

  deploy:
    name: Deploy to Vercel
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install -g pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}

      - run: npm install -g vercel

      - run: vercel deploy --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_1qgWTfhpOyVcjzdFgPV5PeX4
          VERCEL_PROJECT_ID: prj_JxJZz4tOfSexJKVEpQlGLzC1vo9Q
